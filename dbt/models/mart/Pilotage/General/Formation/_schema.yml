version: 2

models:

  - name: mrt_inscrit_formation
    description: "Table mart — inscriptions avec heures réalisées, absence et stage. Expose Int_inscrit_formation."

  - name: mrt_formateur_heures
    description: "Table mart — heures formateur par action. Expose int_formateur_heures."

  - name: mrt_inscrit_pilotage
    description: "Table mart — pilotage par stagiaire : heures prévues vs réalisées, taux de réalisation, CA généré."
    columns:
      - name: stg_stagiaire_id
        tests: [not_null]

  - name: mrt_presence_stagiaire
    description: "Table mart — présences datées par stagiaire (grain séance). Expose int_presence_stagiaire."
    columns:
      - name: stagiaire_id
        tests: [not_null]
      - name: date_seance
        tests: [not_null]
