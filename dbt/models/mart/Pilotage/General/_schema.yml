version: 2

models:

  - name: mrt_activite
    description: "Table mart activité bénéficiaire — marchés ATC, ATR, ESPR (expose int_activite)."
    columns:
      - name: id_benef
        tests: [not_null]
      - name: marche
        tests:
          - not_null
          - accepted_values:
              values: ['ATC', 'ATR', 'ESPR']

  - name: mrt_adhesion
    description: "Table mart adhésion bénéficiaire (expose int_adhesion)."
    columns:
      - name: id_benef
        tests: [not_null]

  - name: mrt_rdv
    description: "Table mart RDV lot/site agrégés (expose int_rdv_lot_site)."
